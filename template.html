<style>
  :root{
    --page:#fff9fc; --card:#ffffff; --ink:#000000; --muted:#474e5a; --line:#c9ced7;
    --band:#0b1d3a; --band-ink:#ffffff; --head:#0b1d3a; --head-ink:#ffffff;
    --wash:#fdeaf2; --pink:#f3b9d1; --rose:#b0406f; --track:#eceef2; --grid:#e3e6eb;
    --us:#1f4b99; --cn:#b3263a; --eu:#2f6b55; --ip:#9a6b00; --hm:#6b7280; --rw:#a3a9b3;
    --ok:#17603a; --bad:#a01c2e; --fan:rgba(243,185,209,.5);
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --page:#08132a; --card:#0e1c3a; --ink:#f3f5f9; --muted:#a5afc2; --line:#2b3c61;
    --band:#040a17; --band-ink:#ffffff; --head:#182a50; --head-ink:#f3f5f9;
    --wash:#1a2443; --pink:#f3b9d1; --rose:#f3b9d1; --track:#16264a; --grid:#1c2b4d;
    --us:#8fb4ea; --cn:#ee8494; --eu:#74c9a9; --ip:#e3bb63; --hm:#97a1b4; --rw:#66728a;
    --ok:#7fd1a0; --bad:#f39aa5; --fan:rgba(243,185,209,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--page);color:var(--ink);
       font-family:"Times New Roman",Times,serif;font-size:17px;line-height:1.5}
  button,input,select{font-family:inherit;font-size:1rem;color:inherit}
  a{color:inherit}
  p{margin:.55rem 0}
  .quiet{color:var(--muted);font-size:.93rem}

  /* Top bar */
  #bar{background:var(--band);color:var(--band-ink);border-bottom:4px solid var(--pink);
       position:sticky;top:0;z-index:20}
  .bar-in{max-width:1120px;margin:0 auto;padding:.6rem 1.2rem;display:flex;
          justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
  #bar h1{font-size:1.45rem;font-weight:400;margin:0}
  #bar nav{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
  .lnk{background:none;border:1px solid transparent;color:var(--band-ink);padding:.25rem .6rem;
       cursor:pointer;border-radius:2px;text-decoration:none}
  .lnk:hover{border-color:var(--pink)}
  .wrap{max-width:1120px;margin:0 auto;padding:1rem 1.2rem 2.4rem}

  /* Period track and roster */
  .track{list-style:none;display:flex;margin:.4rem 0 .5rem;padding:0;position:relative}
  .track::before{content:"";position:absolute;left:10%;right:10%;top:.95rem;border-top:2px solid var(--line)}
  .station{flex:1;text-align:center;position:relative;color:var(--muted)}
  .station .pin{display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;
       background:var(--card);border:2px solid var(--line);position:relative;font-size:.95rem}
  .station .yr{display:block;font-size:.84rem;margin-top:.15rem}
  .station.done .pin{background:var(--pink);border-color:var(--pink);color:#000}
  .station.now{color:var(--ink)}
  .station.now .pin{background:var(--band);border-color:var(--pink);color:#fff;
       box-shadow:0 0 0 4px var(--pink)}
  .roster{list-style:none;display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1rem;padding:0}
  .chip{border:1px solid var(--line);background:var(--card);padding:.12rem .6rem;font-size:.9rem;
        border-left:6px solid var(--c)}
  .chip.turn{border-color:var(--c);background:var(--wash)}
  .chip .st{color:var(--muted)}

  h2{font-size:1.25rem;font-weight:400;margin:0 0 .5rem}
  h3{font-size:1.08rem;font-weight:400;font-style:italic;margin:1.1rem 0 .3rem}
  .sect{margin:1.8rem 0 .6rem;padding-bottom:.2rem;border-bottom:2px solid var(--ink)}

  .card{background:var(--card);border:1px solid var(--line);padding:1rem 1.1rem;min-width:0}
  .card.sheet{background:var(--wash);border-color:var(--pink);position:relative;overflow:hidden}
  .desk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}
  .desk.cols{align-items:start}
  .col{display:grid;gap:1rem;min-width:0}
  @media(max-width:860px){.desk{grid-template-columns:minmax(0,1fr)}}

  /* Seat placards on the opening table */
  .table4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem;margin:1rem 0}
  @media(max-width:980px){.table4{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:520px){.table4{grid-template-columns:minmax(0,1fr)}}
  .placard{display:flex;flex-direction:column;text-align:left;background:var(--card);
       border:1px solid var(--line);padding:0;cursor:pointer;border-radius:0;
       transition:transform .15s,box-shadow .15s}
  .placard:hover{transform:translateY(-3px);box-shadow:0 6px 0 -2px var(--c)}
  .placard .tent{display:block;height:.8rem;
       background:repeating-linear-gradient(135deg,var(--c) 0 6px,transparent 6px 12px)}
  .placard[aria-pressed="true"] .tent{background:var(--c)}
  .placard[aria-pressed="true"]{border-color:var(--c);box-shadow:0 4px 0 -1px var(--c)}
  .placard .body{display:block;padding:.7rem .85rem .8rem}
  .placard .pname{display:block;font-size:1.3rem}
  .placard svg{display:block;width:100%;height:42px;margin:.3rem 0}
  .placard dl{display:grid;grid-template-columns:1fr auto;gap:0 .6rem;margin:.2rem 0 .5rem;font-size:.95rem}
  .placard dt{color:var(--muted)} .placard dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  .placard .pgoal{display:block;font-size:.95rem;min-height:5.6em}
  .placard .pstate{display:block;margin-top:.6rem;padding:.3rem .5rem;text-align:center;
       border:1px solid var(--c);color:var(--c)}
  .placard[aria-pressed="true"] .pstate{background:var(--c);color:var(--card)}

  /* Tables */
  table{border-collapse:collapse;width:100%;font-size:.96rem}
  th{font-weight:400;text-align:left;background:var(--head);color:var(--head-ink);
     padding:.32rem .55rem;vertical-align:bottom}
  td{padding:.3rem .55rem;border-bottom:1px solid var(--line);vertical-align:top}
  th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
  td.nw,th.nw{white-space:nowrap}
  tr.total td{border-top:2px solid var(--ink);border-bottom:0}
  tr.own td{background:var(--wash)}
  caption{caption-side:bottom;text-align:left;color:var(--muted);font-size:.9rem;padding:.45rem .1rem 0}
  .scroll{overflow-x:auto}
  .scroll > table{min-width:30rem}
  .tag{font-size:.84rem;color:var(--muted);margin-left:.45rem;white-space:nowrap}
  .swatch{display:inline-block;width:.62rem;height:.62rem;margin-right:.45rem;background:var(--c)}
  .ok{color:var(--ok)}.miss{color:var(--bad)}
  td.barcell{width:34%}
  .hbar{height:.72rem;background:var(--c);width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}

  .seatbar{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;
       background:var(--band);color:#fff;padding:.5rem .9rem;margin:0 0 1rem;border-left:12px solid var(--c)}
  .seatbar .who{font-size:1.3rem}

  .btn{background:var(--card);color:var(--ink);border:1px solid var(--ink);padding:.42rem 1.05rem;
       cursor:pointer;border-radius:2px}
  .btn:hover{background:var(--wash)}
  .btn.primary{background:var(--band);color:#fff;border-color:var(--band);
       box-shadow:0 4px 0 0 var(--pink);transition:transform .08s,box-shadow .08s}
  .btn.primary:hover{background:#000}
  .btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 0 var(--pink)}
  .btn.big{font-size:1.15rem;padding:.6rem 1.6rem}
  :root[data-theme="dark"] .btn.primary{background:var(--pink);border-color:var(--pink);color:#000;
       box-shadow:0 4px 0 0 rgba(255,255,255,.35)}
  :root[data-theme="dark"] .btn.primary:hover{background:#fff}
  .btn.small{font-size:.92rem;padding:.2rem .6rem}
  .btnrow{margin:1rem 0;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
  input[type=number],select{background:var(--card);border:1px solid var(--muted);padding:.26rem .45rem;border-radius:2px}
  input.iv{width:5.2rem;text-align:right;font-variant-numeric:tabular-nums}
  :focus-visible{outline:3px solid var(--pink);outline-offset:2px}
  .err{color:var(--bad);margin:.4rem 0;min-height:1.4em}

  /* Commitment lever */
  .rate{display:flex;align-items:baseline;gap:.6rem;margin:.1rem 0}
  .rate .v{font-size:3.4rem;line-height:1.05;font-variant-numeric:tabular-nums}
  .rate .u{color:var(--muted)}
  input[type=range]{width:100%;accent-color:var(--c, var(--band));margin:.5rem 0 0;height:1.6rem}
  .scale{display:flex;justify-content:space-between;color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}

  /* Gauges and interval bars */
  .gauge{margin:1rem 0}
  .glabel{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
  .gtrack{position:relative;height:1.1rem;background:var(--track);margin:.3rem 0 .2rem}
  .gzone{position:absolute;top:0;bottom:0;background:var(--pink);opacity:.75}
  .gtick{position:absolute;top:-.25rem;bottom:-.25rem;width:2px;background:var(--ink)}
  .gdot{position:absolute;top:50%;width:.8rem;height:.8rem;border-radius:50%;
        transform:translate(-50%,-50%);transition:left .35s;border:2px solid var(--c)}
  .gdot.pub{background:var(--card)} .gdot.proj{background:var(--c)}
  .gfill{position:absolute;top:0;bottom:0;left:0;background:var(--c);transition:width .35s}
  .gfill.add{background:repeating-linear-gradient(135deg,var(--c) 0 5px,var(--pink) 5px 10px)}
  .gkey{color:var(--muted);font-size:.92rem}
  .ivbar{position:relative;height:1rem;background:var(--track);margin:.35rem 0}
  .ivbar .staff{position:absolute;top:.3rem;bottom:.3rem;background:var(--muted);opacity:.55}
  .ivbar .stated{position:absolute;top:0;bottom:0;border:2px solid var(--c);background:var(--fan);transition:left .25s,width .25s}
  .ivbar .mark{position:absolute;top:-.3rem;bottom:-.3rem;width:4px;background:var(--ink);
        transform:translateX(-50%);transition:left 1s cubic-bezier(.2,.7,.2,1)}
  .ivrow{margin:.9rem 0;padding-top:.6rem;border-top:1px solid var(--line)}
  .ivin{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}

  /* Stamps */
  .stamp{display:inline-block;border:3px double var(--rose);color:var(--rose);padding:.1rem .7rem;
         letter-spacing:.12em;text-transform:uppercase;transform:rotate(-4deg);font-size:1.05rem}
  .stamp.fav{border-color:var(--ok);color:var(--ok)} .stamp.unf{border-color:var(--bad);color:var(--bad)}
  .sealed{position:absolute;right:1rem;top:1rem;font-size:1.6rem;animation:stampIn .55s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes stampIn{from{opacity:0;transform:rotate(-4deg) scale(2.2)}to{opacity:1;transform:rotate(-4deg) scale(1)}}
  .reveal > *{animation:rise .5s both}
  .reveal > *:nth-child(2){animation-delay:.15s}.reveal > *:nth-child(3){animation-delay:.3s}
  .reveal > *:nth-child(4){animation-delay:.45s}.reveal > *:nth-child(n+5){animation-delay:.6s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

  .circular{border:2px solid var(--ink);margin:.9rem 0;background:var(--card)}
  .circular .chead{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;
       background:#000;color:#fff;padding:.3rem .8rem}
  .circular p{margin:.6rem .8rem}
  .envelope{text-align:center;padding:3rem 1rem;border:1px solid var(--line);background:var(--card);
       background-image:linear-gradient(135deg,transparent 49.6%,var(--line) 49.6% 50.4%,transparent 50.4%),
                        linear-gradient(45deg,transparent 49.6%,var(--line) 49.6% 50.4%,transparent 50.4%)}
  .outcomes{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.8rem;margin:1rem 0}
  .outcomes .card,.stack .card{border-top:8px solid var(--c)}
  .stack{display:grid;gap:.9rem;margin:1rem 0}
  .stack .card{position:relative}
  .stack .card .stamp{position:absolute;right:1.1rem;top:.9rem}

  .interstitial{position:fixed;inset:0;background:var(--band);color:#fff;display:none;z-index:50;
       align-items:center;justify-content:center;text-align:center;padding:2rem}
  .interstitial.active{display:flex}
  .interstitial .inner{max-width:34rem}
  .seal{font-size:1.7rem;border-bottom:4px solid var(--pink);padding-bottom:.5rem;margin-bottom:1rem}
  .interstitial .btn{background:#fff;color:#000;border-color:#fff}

  dialog{max-width:860px;width:calc(100% - 2rem);border:2px solid var(--ink);background:var(--page);
         color:var(--ink);padding:0}
  dialog::backdrop{background:rgba(4,10,23,.6)}
  .book-head{display:flex;justify-content:space-between;align-items:center;background:var(--band);
       color:#fff;padding:.5rem .9rem}
  .book-head h2{margin:0}
  .tabs{display:flex;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding:0 .9rem;gap:.2rem;margin-top:.6rem}
  .tabs button{background:none;border:1px solid transparent;border-bottom:0;padding:.3rem .7rem;cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--ink);color:var(--page)}
  .book-body{padding:.6rem 1rem 1rem;max-height:70vh;overflow:auto}

  .chart{width:100%;min-height:320px}
  .chart.tall{min-height:400px}
  details{margin:1rem 0;border:1px solid var(--line);background:var(--card);padding:.5rem .9rem}
  summary{cursor:pointer;font-size:1.1rem}
  footer{margin-top:2.4rem;border-top:2px solid var(--ink);padding-top:.5rem;color:var(--muted);font-size:.93rem}
  ol.steps{padding-left:1.4rem;margin:.4rem 0} ol.steps li{margin:.4rem 0}
  ul.plain{padding-left:1.2rem;margin:.3rem 0} ul.plain li{margin:.35rem 0}
  @media print{#bar nav,.btnrow{display:none}}
</style>

<script>/*__ENGINE__*/</script>
<script>
"use strict";
const PAYLOAD = /*__PAYLOAD__*/null;
const REF = /*__REFERENCE__*/null;
const E = Engine, M = PAYLOAD.model, D = PAYLOAD.design, P = E.prepare(PAYLOAD);
const US = "United States", CN = "China", EU = "NATO Europe", IP = "Indo-Pacific allies";
const SEATS = D.seat_order, LAST = D.periods.length - 1;
const CODE = { [US]: "us", [CN]: "cn", [EU]: "eu", [IP]: "ip", "Hedging middle powers": "hm", "Rest of world": "rw" };
let G = null, REDRAW = [];
const pick = Object.fromEntries(SEATS.map((s, i) => [s, i === 0]));

/* ------------------------------------------------------------ helpers */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fix = (v, dp) => { const s = Number(v).toFixed(dp == null ? 1 : dp); return +s === 0 ? s.replace("-", "") : s; };
const f = (v, dp) => fix(v, dp).replace("-", "−");
const sg = (v, dp) => (+fix(v, dp) > 0 ? "+" : "") + f(v, dp);
const loc = (v, dp) => v.toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
const bn = (v) => loc(v / 1000, 1);
const sbn = (v, dp) => (v > 0 ? "+" : v < 0 ? "−" : "") + loc(Math.abs(v) / 1000, dp);
const cv = (b) => `var(--${CODE[b]})`;
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const hex = (b) => css("--" + CODE[b]);
const sw = (b) => `<span class="swatch" style="--c:${cv(b)}"></span>`;
const qx = (qi) => 2026.5 + qi * 0.25;
const snap = (v) => Math.round(v / D.step) * D.step;
const world = (lvl) => M.blocks.reduce((a, b) => a + lvl[b], 0);
const alliedSum = (lvl) => lvl[EU] + lvl[IP];
const coalition = (lvl) => D.coalition.reduce((a, b) => a + lvl[b], 0);
const holder = (b) => (SEATS.includes(b) && G.human[b] ? "committee" : "model");
const refQ = (key, q) => REF.dist[key][REF.probs.findIndex((x) => Math.abs(x - q) < 1e-9)];
const refMed = (key) => refQ(key, 0.5);
const limit = (seat) => refQ("cum:" + seat, D.resource_quantile);
const opWord = (o) => (o.op === ">=" ? "at or above " : "at or below ") + f(refMed(o.measure), o.dp);
const met = (o, v) => (o.op === ">=" ? v >= refMed(o.measure) : v <= refMed(o.measure));
const pctOf = (v, lo, hi) => Math.max(0, Math.min(100, 100 * (v - lo) / (hi - lo)));
const OUTCOME_RULE = "An outcome is favorable when every objective is met and cumulative outlays are within the resource limit. An outcome is mixed when at least one objective is met. An outcome is unfavorable when no objective is met.";

function missionTable(seat, head, cols, tail) {
  return `<div class="scroll"><table>
    <thead><tr><th>Objective</th><th class="r">Threshold</th>${head}</tr></thead>
    <tbody>${D.seats[seat].objectives.map((o) => `<tr><td>${o.label}</td><td class="r nw">${opWord(o)}</td>${cols(o)}</tr>`).join("")}
    <tr><td>Resource limit: cumulative outlays, ${D.start_year} to ${D.horizon}, billions</td><td class="r nw">at or below ${bn(limit(seat))}</td>${tail}</tr></tbody>
  </table></div>`;
}
function period(k) {
  const ys = D.periods[k].years, dy = ys[0] - 1;
  return { k, ys, roman: D.periods[k].roman, decisionYear: dy, pubYear: dy - 1,
           pubQ: E.qIndex(dy, 2), growthYear: ys[0], endYear: ys[ys.length - 1],
           usdQ: k < LAST ? E.qIndex(ys[ys.length - 1], 2) : E.qIndex(D.horizon, 4) };
}
function growthOf(year, b) {
  if (year <= M.base_year) return M.history.growth[b][M.history.years.indexOf(year)];
  return G.recs[year].g[b];
}
const levelOf = (year, b) => (year <= M.base_year
  ? M.history.levels[b][M.history.years.indexOf(year)] : G.states[year].lvl[b]);
function alliedGrowth(year) {
  return 100 * (alliedSum(G.states[year].lvl) / alliedSum(G.states[year - 1].lvl) - 1);
}

/* --------------------------------------------------------------- game */
function advance(commit) {
  const res = E.step(P, G.W, G.states[G.year], commit);
  G.year = res.state.year;
  G.states[G.year] = res.state;
  G.recs[G.year] = res.rec;
  res.rec.quarters.forEach((k) => { G.q[k.qi] = { usd: k.usd, cny: k.cny }; });
}
function newGame(seed, human) {
  const rng = E.Rng(seed);
  G = { seed, human, year: M.base_year, states: {}, recs: {}, q: {}, k: 0, turn: 0,
        sheets: [], scores: [], order: SEATS.filter((s) => human[s]) };
  G.W = E.drawWorld(P, rng, { usModel: !human[US], cnModel: !human[CN] });
  G.states[G.year] = E.initialState(P);
  G.q[-1] = { usd: M.reserve.usd0, cny: M.reserve.cny0 };

}
function publishedState(pi) {
  const s = E.copyState(G.states[pi.pubYear]), q = G.q[pi.pubQ];
  const now = G.states[pi.decisionYear];
  s.zU = q.usd; s.zC = E.logit(q.cny); s.q = pi.pubQ;
  s.eventYear = now.eventYear; s.eventQ = now.eventQ;
  return s;
}
function staffEstimate(seat, pi, draft) {
  const fixed = {}, start = publishedState(pi), obs = [];
  fixed[pi.decisionYear] = { [seat]: G.recs[pi.decisionYear].g[seat] };
  pi.ys.forEach((y) => {
    fixed[y] = { [seat]: draft.g };
    if (seat === CN && draft.event === y) fixed[y].event = true;
  });
  for (let y = D.start_year; y <= pi.pubYear; y++) obs.push(G.recs[y].g[US]);
  return E.estimate(P, {
    prior: seat !== US ? E.pathwayPosterior(P, obs) : undefined,
    seed: G.seed * 7919 + pi.k * 101 + SEATS.indexOf(seat) * 13 + 17,
    n: D.staff_draws, start, fixed, endYear: pi.endYear, usdQ: pi.usdQ,
    growthYear: pi.growthYear, usModel: seat !== US, cnModel: seat !== CN,
    noEventThrough: start.eventYear ? 0 : pi.decisionYear });
}
function resolvePeriod() {
  const pi = period(G.k), sheets = G.sheets[G.k];
  pi.ys.forEach((y) => {
    const c = {};
    G.order.forEach((s) => { c[s] = sheets[s].g; });
    if (G.human[CN] && sheets[CN].event === y) c.event = true;
    advance(c);
  });
  const out = { usd: G.q[pi.usdQ].usd, grow: alliedGrowth(pi.growthYear) }, sc = {};
  G.order.forEach((s) => {
    const sh = sheets[s];
    sc[s] = {
      usd: E.winkler(sh.usd[0], sh.usd[1], out.usd, D.coverage),
      grow: E.winkler(sh.grow[0], sh.grow[1], out.grow, D.coverage),
      staffUsd: E.winkler(sh.staff.usd[0], sh.staff.usd[2], out.usd, D.coverage),
      staffGrow: E.winkler(sh.staff.grow[0], sh.staff.grow[2], out.grow, D.coverage) };
  });
  G.scores[G.k] = { out, seats: sc };
}

    <section class="card sheet" id="sheet"><h2>Commitment</h2>
      <p>Outlays in ${pi.decisionYear} are ${bn(now.lvl[seat])} billion, a real change of ${sg(growthOf(pi.decisionYear, seat))} percent${G.k === 0 ? ", as resolved by the model for the year in progress" : ", as committed in period " + D.periods[G.k - 1].roman}. This figure is known to this committee and is not yet published.</p>
      <label for="g" class="quiet">Real growth per year, ${pi.ys.join(" and ")}</label>
      <div class="rate"><span class="v" id="gv"></span><span class="u">percent</span></div>
      <input type="range" id="g" min="${sd.bounds[0]}" max="${sd.bounds[1]}" step="${D.step}" value="${draft.g}">
      <div class="scale"><span>${sg(sd.bounds[0])}</span><span>observed range, ${D.bound_rule.sample[0]} to ${D.bound_rule.sample[1]}</span><span>${sg(sd.bounds[1])}</span></div>
      <div class="btnrow">${refs.map((r) => `<button class="btn small" data-ref="${snap(r[1])}">${r[0]}, ${sg(r[1])}</button>`).join("")}</div>
      <div id="outlays"></div>
      ${window_.length ? `<p style="margin-top:.9rem"><label for="event">Demonstration</label>
        <select id="event" style="margin-left:.5rem"><option value="0">None this period</option>
        ${window_.map((y) => `<option value="${y}">In ${y}</option>`).join("")}</select></p>
        <p class="quiet">One demonstration is available to this seat between ${M.event_years[0]} and ${M.event_years[1]}. It repeats the measured 2022 episode and carries no score of its own.</p>` : ""}
    </section>
    <section class="card"><h2>Staff estimate and stated intervals</h2>
      <div id="fan" class="chart"></div>
      <div class="ivrow"><label for="u0">US dollar reserve share at ${tq}, in percent</label>
        <div id="ivb-u"></div>
        <div class="ivin"><input class="iv" type="number" step="0.1" id="u0" aria-label="US dollar share, lower bound"> to
          <input class="iv" type="number" step="0.1" id="u1" aria-label="US dollar share, upper bound"><span class="quiet" id="su"></span></div></div>
      <div class="ivrow"><label for="a0">Combined real growth of NATO Europe and the Indo-Pacific allies in ${pi.growthYear}, in percent</label>
        <div id="ivb-a"></div>
        <div class="ivin"><input class="iv" type="number" step="0.1" id="a0" aria-label="Allied growth, lower bound"> to
          <input class="iv" type="number" step="0.1" id="a1" aria-label="Allied growth, upper bound"><span class="quiet" id="sa"></span></div></div>
      <p class="quiet">The staff range is the 10th to 90th percentile of ${loc(D.staff_draws, 0)} draws of the model from the published record, given this commitment. Every other seat is taken at its model equation. Pathway probabilities start equal and are revised on published US growth. The staff cannot see the sealed record or another committee's sheet.</p>
    </section>
    </div>
  </div>
  <p class="err" id="seat-err" role="alert"></p>
  <div class="btnrow"><button class="btn primary big" id="commit">Seal the commitment</button>
    <span class="quiet">${many ? `This is seat ${G.turn + 1} of ${G.order.length} in this period.` : ""}</span></div>`, "seat");

  const hist = M.reserve.history, hx = [], hy = [];
  hist.quarters.forEach((s, i) => {
    const x = +s.slice(0, 4) + (+s.slice(6) - 1) / 4;
    if (x >= 2019) { hx.push(x); hy.push(hist.usd[i]); }
  });
  for (let qi = 0; qi <= pi.pubQ; qi++) { hx.push(qx(qi)); hy.push(G.q[qi].usd); }
  const num = (id) => parseFloat($(id).value);
  const bars = () => {
    const e = draft.est;
    $("ivb-u").innerHTML = ivBar(seat, [e.usd[0], e.usd[2]], [num("u0"), num("u1")]);
    $("ivb-a").innerHTML = ivBar(seat, [e.growth[0], e.growth[2]], [num("a0"), num("a1")]);
  };
  let chart = null;
  const makeFan = () => {
    const e = draft.est, fx = [hx[hx.length - 1]], lo = [hy[hy.length - 1]], md = lo.slice(), hi = lo.slice();
    e.fan.forEach((k) => { fx.push(qx(k.qi)); lo.push(k.p10); md.push(k.p50); hi.push(k.p90); });
    const tx = qx(pi.usdQ), c = hex(seat);
    return { traces: [
      { x: hx, y: hy, mode: "lines", name: "Published", line: { color: css("--ink"), width: 1.6 } },
      { x: fx, y: hi, mode: "lines", line: { width: 0 }, showlegend: false, hoverinfo: "skip" },
      { x: fx, y: lo, mode: "lines", line: { width: 0 }, fill: "tonexty", fillcolor: css("--fan"), name: "Staff, 10th to 90th" },
      { x: fx, y: md, mode: "lines", name: "Staff median", line: { color: css("--rose"), width: 1.6, dash: "dot" } },
      { x: [tx, tx], y: [num("u0"), num("u1")], mode: "lines+markers", name: "Stated interval",
        line: { color: c, width: 3 }, marker: { symbol: "line-ew", size: 12, line: { width: 3, color: c } } }],
      layout: { yaxis: { title: { text: "US dollar share, percent" } }, xaxis: { dtick: 1 } } };
  };
  function refresh() {
    draft.est = staffEstimate(seat, pi, draft);
    const e = draft.est;
    $("gv").textContent = sg(draft.g);
    let lv = now.lvl[seat], cumTo = spent;
    const rows = pi.ys.map((y) => { lv *= 1 + draft.g / 100; cumTo += lv;
      return `<tr><td>${y}</td><td class="r">${bn(lv)}</td><td class="r">${sbn(lv - now.lvl[seat], 1)}</td></tr>`; }).join("");
    $("outlays").innerHTML = `<table><thead><tr><th>Year</th><th class="r">Outlays</th><th class="r">Change from ${pi.decisionYear}</th></tr></thead><tbody>${rows}</tbody><caption>Outlays are in billions of constant 2024 US dollars.</caption></table>`;
    const lim = limit(seat), top = Math.max(lim, cumTo) * 1.08;
    $("gauges").innerHTML = sd.objectives.map((o) => gauge(seat, o, pubMeas[o.measure], e.proj[o.measure],
        o.measure === "usd" || o.measure === "cny" ? "at " + E.qLabel(pi.pubQ) : "for " + pi.pubYear, "for the end of " + pi.endYear)).join("") +
      `<div class="gauge" style="--c:${cv(seat)}"><div class="glabel"><span>Cumulative outlays, ${D.start_year} to ${D.horizon}, billions</span><span class="quiet">Resource limit: at or below ${bn(lim)}</span></div>
        <div class="gtrack"><span class="gfill add" style="width:${pctOf(cumTo, 0, top)}%"></span><span class="gfill" style="width:${pctOf(spent, 0, top)}%"></span><span class="gtick" style="left:${pctOf(lim, 0, top)}%"></span></div>
        <div class="gkey">Outlays through ${pi.decisionYear} are ${bn(spent)}. Under this commitment they reach ${bn(cumTo)} by ${pi.endYear}.</div></div>`;
    $("su").textContent = `The staff range is ${f(e.usd[0], 1)} to ${f(e.usd[2], 1)}.`;
    $("sa").textContent = `The staff range is ${sg(e.growth[0], 1)} to ${sg(e.growth[2], 1)}.`;
    if (draft.autoUsd) { $("u0").value = e.usd[0].toFixed(1); $("u1").value = e.usd[2].toFixed(1); }
    if (draft.autoGrow) { $("a0").value = e.growth[0].toFixed(1); $("a1").value = e.growth[2].toFixed(1); }
    bars();
    if (chart) chart(); else chart = plot("fan", makeFan);
  }
  $("g").oninput = () => { draft.g = +$("g").value; refresh(); };
  document.querySelectorAll("[data-ref]").forEach((b) => {
    b.onclick = () => { draft.g = +b.dataset.ref; $("g").value = draft.g; refresh(); };
  });
  if ($("event")) $("event").onchange = () => { draft.event = +$("event").value; refresh(); };
  ["u0", "u1"].forEach((id) => { $(id).oninput = () => { draft.autoUsd = false; bars(); chart(); }; });
  ["a0", "a1"].forEach((id) => { $(id).oninput = () => { draft.autoGrow = false; bars(); }; });
  refresh();
  settle();

  $("commit").onclick = () => {
    const v = ["u0", "u1", "a0", "a1"].map(num);
    if (v.some((x) => !isFinite(x))) { $("seat-err").textContent = "Enter a number in each interval bound."; return; }
    if (v[0] > v[1] || v[2] > v[3]) { $("seat-err").textContent = "Each lower bound must not exceed its upper bound."; return; }
    G.sheets[G.k] = G.sheets[G.k] || {};
    G.sheets[G.k][seat] = { g: draft.g, event: draft.event, usd: [v[0], v[1]], grow: [v[2], v[3]],
                            staff: { usd: draft.est.usd, grow: draft.est.growth } };
    G.turn += 1;
    $("commit").disabled = true;
    $("sheet").insertAdjacentHTML("beforeend", `<span class="stamp sealed">Sealed</span>`);
    const after = () => {
      if (G.turn < G.order.length) { openSeat(); return; }
      resolvePeriod();
      if (G.k === LAST) envelope(); else resolution();
    };
    setTimeout(() => {
      if (!many) { after(); return; }
      $("app").innerHTML = "";
      if (G.turn < G.order.length) {
        handoff("Commitment sealed", `Pass the device to the ${G.order[G.turn]} committee.`, `Open the ${G.order[G.turn]} paper`, after);
      } else {
        handoff("All commitments sealed", `Period ${pi.roman} resolves. The resolution is public to every committee.`, "Read the resolution", after);
      }
    }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 750);
  };
}

/* ----------------------------------------------------------- scoring */
function scoreRows(k) {
  const pi = period(k), sc = G.scores[k], sheets = G.sheets[k];
  const row = (seat, label, iv, out, w, sw_, dp, signed) => {
    const fm = signed ? sg : f;
    return `<tr><td>${sw(seat)}${seat}</td><td>${label}</td>
      <td class="r">${fm(iv[0], dp)} to ${fm(iv[1], dp)}</td><td class="r">${fm(out, dp)}</td>
      <td class="r ${w.hit ? "ok" : "miss"}">${w.hit ? "inside" : "outside by " + f(w.miss, dp)}</td>
      <td class="r">${f(w.score, 1)}</td><td class="r">${f(sw_.score, 1)}</td></tr>`;
  };
  return G.order.map((s) =>
    row(s, `US dollar share, ${E.qLabel(pi.usdQ)}`, sheets[s].usd, sc.out.usd, sc.seats[s].usd, sc.seats[s].staffUsd, 2, false) +
    row(s, `Allied real growth, ${pi.growthYear}`, sheets[s].grow, sc.out.grow, sc.seats[s].grow, sc.seats[s].staffGrow, 1, true)).join("");
}
const SCORE_HEAD = `<thead><tr><th>Committee</th><th>Quantity</th><th class="r">Stated interval</th><th class="r">Outcome</th><th class="r">Result</th><th class="r">Score</th><th class="r">Staff score</th></tr></thead>`;
function scoreCards(k) {
  const pi = period(k), sc = G.scores[k], sheets = G.sheets[k];
  const one = (s, label, iv, st, out, w, sw_, dp, signed) => {
    const fm = signed ? sg : f;
    return `<div class="ivrow"><div class="glabel"><span>${label}</span><span class="${w.hit ? "ok" : "miss"}">${w.hit ? "The outcome fell inside the interval." : "The outcome fell outside the interval by " + f(w.miss, dp) + "."}</span></div>
      ${ivBar(s, [st[0], st[2]], iv, out)}
      <div class="gkey">The stated interval was ${fm(iv[0], dp)} to ${fm(iv[1], dp)} and the outcome was ${fm(out, dp)}. The score is ${f(w.score, 1)} and the staff score is ${f(sw_.score, 1)}.</div></div>`;
  };
  return G.order.map((s) => `<section class="card" style="--c:${cv(s)}"><h2>${sw(s)}${s} committee</h2>` +
    one(s, `US dollar reserve share at ${E.qLabel(pi.usdQ)}, in percent`, sheets[s].usd, sheets[s].staff.usd, sc.out.usd, sc.seats[s].usd, sc.seats[s].staffUsd, 2, false) +
    one(s, `Allied real growth in ${pi.growthYear}, in percent`, sheets[s].grow, sheets[s].staff.grow, sc.out.grow, sc.seats[s].grow, sc.seats[s].staffGrow, 1, true) +
    `</section>`).join("");
}
function pathwayNote(throughYear) {
  const recs = [];
  for (let y = D.start_year; y <= throughYear; y++) recs.push(G.recs[y]);
  const ev = G.states[Math.min(G.year, throughYear + 1)].eventYear;
  const mean = recs.reduce((a, r) => a + r.g[US], 0) / recs.length;
  return `Mean US real growth from ${D.start_year} to ${throughYear} is ${sg(mean, 2)} percent per year. ${ev ? "A demonstration is recorded in " + ev + "." : "No demonstration is recorded."} The record to date is classed as ${E.classify(P, recs, ev)}. The dividing line between accretion and retrenchment is ${sg(D.us_midpoint, 2)} percent, the midpoint of the two pathway rates.`;
}

/* --------------------------------------------------------- resolution */
function resolution() {
  const pi = period(G.k), nxt = period(G.k + 1);
  const pubQ = G.q[nxt.pubQ], sNow = G.states[nxt.decisionYear];
  const newEvent = sNow.eventYear && sNow.eventYear > pi.decisionYear;
  show(`
  <div class="seatbar" style="--c:var(--pink)"><span class="who">Resolution, period ${pi.roman}</span>
    <span>Record as of November ${nxt.decisionYear}</span></div>
  <div class="reveal">
  ${newEvent ? circularHtml(sNow) : `<p class="quiet">No circular was issued this period.</p>`}
  <section class="card"><h2>Newly published</h2>
    ${recordTable(nxt.pubYear, null)}
    <p>Commitments for ${nxt.pubYear} are now public. Expenditure for ${nxt.decisionYear} will be published in April ${nxt.decisionYear + 1}. At ${E.qLabel(nxt.pubQ)} the US dollar held ${f(pubQ.usd, 2)} percent of allocated reserves and the renminbi held ${f(pubQ.cny, 2)} percent.</p></section>
  <h2 class="sect">Interval statements</h2>
  <div class="outcomes">${scoreCards(G.k)}</div>
  <p class="quiet">The bar shows the stated interval, the grey band shows the staff range, and the vertical marker shows the outcome. The Winkler score at ${Math.round(100 * D.coverage)} percent coverage is the interval width plus ${f(2 / (1 - D.coverage), 0)} times any distance by which the outcome falls outside. A lower score is better.</p>
  <section class="card"><h2>Pathway record</h2><p>${pathwayNote(nxt.pubYear)}</p></section>
  </div>
  <div class="btnrow"><button class="btn primary big" id="next">Open period ${nxt.roman}</button></div>`, "resolution");
  settle();
  $("next").onclick = () => {
    G.k += 1; G.turn = 0;
    if (G.order.length > 1) {
      $("app").innerHTML = "";
      handoff(`Period ${nxt.roman}`, `Pass the device to the ${G.order[0]} committee.`, `Open the ${G.order[0]} paper`, openSeat);
    } else openSeat();
  };
}

/* ------------------------------------------------------------ debrief */
function pctl(key, v) {
  const p = E.percentileOf(REF.dist[key], REF.probs, v);
  return p <= 5 ? "below 5th" : p >= 95 ? "above 95th" : f(p, 0);
}
function envelope() {
  show(`<div class="envelope"><p><span class="stamp">Sealed record</span></p>
    <p>Period ${D.periods[LAST].roman} is resolved and the exercise is complete. The sealed record holds the pathway, the coefficient draws, and every seat's path from ${D.start_year} to ${D.horizon}.</p>
    <div class="btnrow" style="justify-content:center"><button class="btn primary big" id="unseal">Open the sealed record</button></div></div>`, "debrief");
  $("unseal").onclick = debrief;
  $("unseal").focus();
}
function debrief() {
  const years = [], recs = [];
  for (let y = D.start_year; y <= D.horizon; y++) { years.push(y); recs.push(G.recs[y]); }
  const end = G.states[D.horizon], cum = {};
  SEATS.forEach((s) => { cum[s] = years.reduce((a, y) => a + G.states[y].lvl[s], 0); });
  const meas = E.measures(P, end, cum), W = G.W, outcomes = {};
  const cls = E.classify(P, recs, end.eventYear);
  const MEAS = [["cn_us", "China to United States expenditure ratio", 3, ""],
    ["coalition_cn", "Coalition to China expenditure ratio", 2, ""],
    ["us_share_coalition", "United States share of coalition expenditure", 1, "percent"],
    ["allied_share", "NATO Europe and Indo-Pacific allies, share of world", 1, "percent"],
    ["usd", "US dollar reserve share, " + D.horizon + "-Q4", 2, "percent"],
    ["cny", "Renminbi reserve share, " + D.horizon + "-Q4", 2, "percent"]];
  const sealed = [];
  sealed.push(G.human[US] ? "The United States was held by a committee, so no pathway rate was applied to it."
    : `The United States was run at the ${W.usPath === "retrenchment" ? "retrenchment rate, " + sg(M.rates.us_contraction, 2) : "ten-year rate, " + sg(M.rates.us_trend, 2)} percent per year, plus residuals.`);
  sealed.push(G.human[CN] ? (end.eventYear ? `The China committee declared a demonstration in ${end.eventYear}, and it fell in ${E.qLabel(end.eventQ)}.` : "The China committee declared no demonstration.")
    : (end.eventYear ? `The sealed pathway placed a demonstration in ${end.eventYear}, and it fell in ${E.qLabel(end.eventQ)}.` : "The sealed pathway contained no demonstration."));

  const cards = G.order.map((s) => {
    const obj = D.seats[s].objectives, nMet = obj.filter((o) => met(o, meas[o.measure])).length;
    const c = cum[s], within = c <= limit(s);
    const outcome = nMet === obj.length && within ? "favorable" : nMet > 0 ? "mixed" : "unfavorable";
    let n = 0, hit = 0, sc = 0, st = 0;
    G.scores.forEach((k) => ["usd", "grow"].forEach((q) => {
      n += 1; hit += k.seats[s][q].hit ? 1 : 0; sc += k.seats[s][q].score;
      st += k.seats[s][q === "usd" ? "staffUsd" : "staffGrow"].score; }));
    outcomes[s] = { outcome, objectives_met: nMet, cumulative_outlays_musd: c, resource_limit_musd: limit(s),
                    intervals_inside: hit, intervals: n, mean_score: sc / n, staff_mean_score: st / n };
    return `<section class="card" style="--c:${cv(s)}"><h2>${s} committee</h2>
      <span class="stamp ${outcome === "favorable" ? "fav" : outcome === "unfavorable" ? "unf" : ""}">${outcome}</span>
      <p>${D.seats[s].goal}</p>
      ${missionTable(s, `<th class="r">Outcome</th><th class="r">Result</th>`,
        (o) => `<td class="r">${f(meas[o.measure], o.dp)}</td><td class="r ${met(o, meas[o.measure]) ? "ok" : "miss"}">${met(o, meas[o.measure]) ? "met" : "not met"}</td>`,
        `<td class="r">${bn(c)}</td><td class="r ${within ? "ok" : "miss"}">${within ? "within" : "over by " + bn(c - limit(s))}</td>`)}
      <p>Of ${n} interval statements, ${hit} were inside, against ${f(n * D.coverage, 1)} expected at ${Math.round(100 * D.coverage)} percent coverage. The mean score was ${f(sc / n, 1)} and the staff mean score was ${f(st / n, 1)}. Cumulative outlays differed from the reference median by ${sbn(c - refMed("cum:" + s), 1)} billion.</p></section>`;
  }).join("");

  const elicit = G.order.map((s) => {
    const rows = years.filter((y) => y > D.start_year).map((y) => {
      const r = G.recs[y], dev = r.g[s] - r.model[s].fitted;
      return `<tr><td>${y}</td><td class="r">${sg(r.lagUS)}</td><td class="r">${sg(r.lagCN)}</td>
        <td class="r">${sg(r.g[s])}</td><td class="r">${sg(r.model[s].fitted)}</td><td class="r">${sg(dev)}</td>
        <td class="r">${f(E.residualPercentile(P, s, dev), 0)}</td><td class="r">${sg(r.model[s].sealed)}</td></tr>`;
    }).join("");
    return `<h3 style="color:${cv(s)}">${s} committee</h3>
      <div class="scroll"><table><thead><tr><th>Year</th><th class="r">US growth, prior year</th><th class="r">China growth, prior year</th><th class="r">Committed</th><th class="r">Model equation</th><th class="r">Deviation</th><th class="r">Percentile</th><th class="r">Sealed model value</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join("");
  const crow = (eq, on, est, se, draw, r2, tag) => `<tr><td>${eq}<span class="tag">${tag}</span></td><td>${on}</td>
    <td class="r">${sg(est, 3)} (${f(se, 3)})</td><td class="r">${sg(draw, 3)}</td><td class="r">${f(r2, 3)}</td></tr>`;
  const coefRows = M.allied.map((t) => {
    const fb = M.feedback[t], c = W.coef[t];
    return crow(sw(t) + t, "US real growth, prior year", fb.mean[1], fb.se[1], c[1], fb.r2, holder(t)) +
           crow(sw(t) + t, "China real growth, prior year", fb.mean[2], fb.se[2], c[2], fb.r2, holder(t));
  }).join("") +
    crow("US dollar reserve share, points", "Log change, China to US ratio", M.reserve.usd.mean[1], M.reserve.usd.se[1], W.usd[1], M.reserve.usd.r2, "model") +
    crow("Renminbi reserve share, log-odds", "Log change, China to US ratio", M.reserve.cny.mean[1], M.reserve.cny.se[1], W.cny[1], M.reserve.cny.r2, "model");

  show(`
  <div class="seatbar" style="--c:var(--pink)"><span class="who">Debrief</span><span>Sealed record, ${D.start_year} to ${D.horizon}, seed ${G.seed}</span></div>
  <div class="reveal">
  <p>The record is classed as ${cls}. ${sealed.join(" ")} ${OUTCOME_RULE} Outcomes are assessed seat by seat and are not ranked against each other.</p>
  ${circularHtml(end)}
  <div class="stack">${cards}</div>
  <h2 class="sect">Expenditure</h2>
  <div id="c-exp" class="chart tall"></div>
  <p class="quiet">Solid lines are this exercise. Dotted lines are the reference, which is the median of the accretion pathway with every seat run by the model at ${loc(REF.draws, 0)} draws.</p>
  <h2 class="sect">Reserve shares</h2>
  <div id="c-res" class="chart"></div>
  <h2 class="sect">Position at ${D.horizon}</h2>
  <div class="scroll"><table>
    <thead><tr><th>Measure</th><th class="r">Outcome</th><th class="r">Reference median</th><th class="r">Percentile in reference</th></tr></thead>
    <tbody>${MEAS.map((m) => `<tr><td>${m[1]}${m[3] ? ", " + m[3] : ""}</td><td class="r">${f(meas[m[0]], m[2])}</td><td class="r">${f(refMed(m[0]), m[2])}</td><td class="r">${pctl(m[0], meas[m[0]])}</td></tr>`).join("")}</tbody>
    <caption>The coalition is the United States, NATO Europe, and the Indo-Pacific allies. Percentile is the position of the outcome in the reference distribution.</caption>
  </table></div>
  <details><summary>Interval statements, all periods</summary>
    <div class="scroll"><table>${SCORE_HEAD}<tbody>${G.scores.map((_, k) => scoreRows(k)).join("")}</tbody></table></div></details>
  <details><summary>Commitments against the model</summary>
    <p>Each commitment is set against the value of the model equation for that seat at the growth rates realized in the prior year, using the published point estimates. For the two principals the equation is the ten-year rate. Percentile is the share of the seat's historical residuals, ${M.resid.years[0]} to ${M.resid.years[M.resid.years.length - 1]}, that lie below the deviation. The last column is the value the model would have drawn for the seat in this sealed record.</p>
    ${elicit}</details>
  <details><summary>Sealed coefficients</summary>
    <div class="scroll"><table>
    <thead><tr><th>Equation</th><th>Coefficient on</th><th class="r">Estimate</th><th class="r">Sealed draw</th><th class="r">R squared</th></tr></thead>
    <tbody>${coefRows}</tbody>
    <caption>Standard errors are in parentheses. The estimates are from The Primacy Premium, release ${esc(M.source.version)}. Each sealed draw is one draw from the joint normal distribution of the estimate. A seat held by a committee does not use its equation.</caption>
  </table></div></details>
  </div>
  <div class="btnrow"><button class="btn primary big" id="save">Download the record</button>
    <button class="btn" id="again">Convene again</button></div>`, "debrief");

  const hy = M.history.years.filter((y) => y >= 2015), off = M.history.years.indexOf(2015);
  plot("c-exp", () => {
    const traces = [];
    M.blocks.forEach((b) => {
      const seat = SEATS.includes(b);
      traces.push({ x: hy.concat(years), y: M.history.levels[b].slice(off).concat(years.map((y) => G.states[y].lvl[b])).map((v) => v / 1000),
                    mode: "lines", name: b, line: { color: hex(b), width: seat ? 2.2 : 1.2 } });
      if (seat) traces.push({ x: [M.base_year].concat(years), y: [M.base[b]].concat(years.map((y) => REF.year_medians[y][b])).map((v) => v / 1000),
                    mode: "lines", showlegend: false, hoverinfo: "skip", line: { color: hex(b), width: 1.2, dash: "dot" } });
    });
    return { traces, layout: { yaxis: { title: { text: "Billions, constant 2024 US dollars" } },
      shapes: [{ type: "line", x0: M.base_year, x1: M.base_year, yref: "paper", y0: 0, y1: 1, line: { color: css("--muted"), width: 1, dash: "dot" } }] } };
  });
  const hist = M.reserve.history, rx = [], ru = [], rc = [];
  hist.quarters.forEach((s, i) => { const x = +s.slice(0, 4) + (+s.slice(6) - 1) / 4;
    if (x >= 2017) { rx.push(x); ru.push(hist.usd[i]); rc.push(hist.cny[i]); } });
  for (let qi = 0; qi < P.nq; qi++) { rx.push(qx(qi)); ru.push(G.q[qi].usd); rc.push(G.q[qi].cny); }
  const fx = REF.usd_fan.map((k) => qx(k.qi));
  plot("c-res", () => ({ traces: [
    { x: fx, y: REF.usd_fan.map((k) => k.p90), mode: "lines", line: { width: 0 }, showlegend: false, hoverinfo: "skip" },
    { x: fx, y: REF.usd_fan.map((k) => k.p10), mode: "lines", line: { width: 0 }, fill: "tonexty", fillcolor: css("--fan"), name: "Reference, 10th to 90th" },
    { x: rx, y: ru, mode: "lines", name: "US dollar", line: { color: hex(US), width: 2 } },
    { x: rx, y: rc, mode: "lines", name: "Renminbi (right axis)", yaxis: "y2", line: { color: hex(CN), width: 2 } }],
    layout: { yaxis: { title: { text: "US dollar share, percent" } },
       yaxis2: { title: { text: "Renminbi share, percent" }, overlaying: "y", side: "right", showgrid: false, zeroline: false, linecolor: css("--muted"), rangemode: "tozero" },
       margin: { l: 56, r: 56, t: 14, b: 40 } } }));

  $("again").onclick = front;
  $("save").onclick = () => {
    const rec = {
      exercise: "The Primacy Premium, Committee Exercise", model: M.source, seed: G.seed,
      seats: Object.fromEntries(SEATS.map((s) => [s, G.human[s] ? "committee" : "model"])),
      classification: cls, sealed: { pathway: W.path, us_rate: W.usPath, event_year: end.eventYear,
        event_quarter: end.eventYear ? E.qLabel(end.eventQ) : null, coefficients: W.coef, usd: W.usd, cny_logit: W.cny },
      commitments: G.sheets, scores: G.scores,
      years: years.map((y) => ({ year: y, growth_pct: G.recs[y].g, level_musd: G.states[y].lvl, model: G.recs[y].model })),
      quarters: Object.keys(G.q).map(Number).sort((a, b) => a - b).filter((qi) => qi >= 0)
        .map((qi) => ({ quarter: E.qLabel(qi), usd_pct: G.q[qi].usd, cny_pct: G.q[qi].cny })),
      outcomes, position: meas, reference_medians: Object.fromEntries(Object.keys(REF.dist).map((k) => [k, refMed(k)])) };
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(rec, null, 1)], { type: "application/json" }));
    a.download = `committee-exercise-${G.seed}.json`;
    document.body.appendChild(a); a.click(); a.remove();
  };
}

/* --------------------------------------------------------------- boot */
SEATS.forEach((s) => {
  const y = M.history.years, lv = M.history.levels[s];
  const i0 = y.indexOf(M.rates.trend_window[0]), i1 = y.indexOf(M.rates.trend_window[1]);
  D.seats[s].trend = 100 * (Math.pow(lv[i1] / lv[i0], 1 / (i1 - i0)) - 1);
});
$("foot").innerHTML = `This exercise is by Alyssa I. Agard and is licensed CC BY-NC 4.0. It runs <a href="${M.source.repository}">The Primacy Premium</a>, release ${esc(M.source.version)}, at commit ${M.source.commit.slice(0, 7)}, and was built on ${esc(PAYLOAD.meta.built)}. The source and the method are in the <a href="https://github.com/alyssaagard/primacy-committee-exercise">repository</a>.`;
$("book-btn").onclick = () => openBook(G ? 1 : 0);
$("book-close").onclick = () => $("book").close();
$("theme-btn").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
let stored = null;
try { stored = localStorage.getItem("cx-theme"); } catch (e) { /* storage is optional */ }
setTheme(stored === "dark" ? "dark" : "light");
window.CX = { get game() { return G; }, front, newGame, setTheme };
front();
</script>
