<script>/*__ENGINE__*/</script>
<script>
"use strict";
const PAYLOAD = /*__PAYLOAD__*/null;
const REF = /*__REFERENCE__*/null;
const E = Engine, M = PAYLOAD.model, D = PAYLOAD.design, P = E.prepare(PAYLOAD);
const US = "United States", CN = "China", EU = "NATO Europe", IP = "Indo-Pacific allies";
const SEATS = D.seat_order;
const COLOR = { [US]: "#8fb4ea", [CN]: "#e8798a", [EU]: "#6fc7a6", [IP]: "#e0b860",
                "Hedging middle powers": "#8e99ad", "Rest of world": "#5d6a82" };
const T = { ink: "#e9edf5", line: "#33456b", grid: "#1b2742", pink: "#f3c4d9",
            band: "rgba(243,196,217,.26)", muted: "#98a4b8" };
const LAST = D.periods.length - 1;
let G = null;

/* ------------------------------------------------------------ helpers */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fix = (v, dp) => { const s = Number(v).toFixed(dp == null ? 1 : dp); return +s === 0 ? s.replace("-", "") : s; };
const f = (v, dp) => fix(v, dp).replace("-", "\u2212");
const sg = (v, dp) => (+fix(v, dp) > 0 ? "+" : "") + f(v, dp);
const bn = (v) => (v / 1000).toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const sbn = (v, dp) => (v > 0 ? "+" : v < 0 ? "\u2212" : "") + (Math.abs(v) / 1000).toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
const sw = (b) => `<span class="swatch" style="background:${COLOR[b]}"></span>`;
const qx = (qi) => 2026.5 + qi * 0.25;
const snap = (v) => Math.round(v / D.step) * D.step;
const world = (lvl) => M.blocks.reduce((a, b) => a + lvl[b], 0);
const alliedSum = (lvl) => lvl[EU] + lvl[IP];
const coalition = (lvl) => D.coalition.reduce((a, b) => a + lvl[b], 0);
const holder = (b) => !SEATS.includes(b) ? "model" : G.human[b] ? "committee" : "model";

function period(k) {
  const ys = D.periods[k].years, dy = ys[0] - 1;
  return { k, ys, roman: D.periods[k].roman, decisionYear: dy, pubYear: dy - 1,
           pubQ: E.qIndex(dy, 2), growthYear: ys[0], endYear: ys[ys.length - 1],
           usdQ: k < LAST ? E.qIndex(ys[ys.length - 1], 2) : E.qIndex(D.horizon, 4) };
}
function growthOf(year, b) {
  if (year <= M.base_year) return M.history.growth[b][M.history.years.indexOf(year)];
  return G.recs[year].g[b];
}
function alliedGrowth(year) {
  return 100 * (alliedSum(G.states[year].lvl) / alliedSum(G.states[year - 1].lvl) - 1);
}

/* --------------------------------------------------------------- game */
function advance(commit) {
  const res = E.step(P, G.W, G.states[G.year], commit);
  G.year = res.state.year;
  G.states[G.year] = res.state;
  G.recs[G.year] = res.rec;
  res.rec.quarters.forEach((k) => { G.q[k.qi] = { usd: k.usd, cny: k.cny }; });
}

function newGame(seed, human) {
  const rng = E.Rng(seed);
  G = { seed, human, year: M.base_year, states: {}, recs: {}, q: {}, k: 0, turn: 0,
        sheets: [], scores: [], order: SEATS.filter((s) => human[s]) };
  G.W = E.drawWorld(P, rng, { usModel: !human[US], cnModel: !human[CN] });
  G.states[G.year] = E.initialState(P);
  G.q[-1] = { usd: M.reserve.usd0, cny: M.reserve.cny0 };
  advance({});                      // 2026 is resolved by the model for every seat
  openSeat();
}

/* State at the last published year, reserves at the last published quarter. */
function publishedState(pi) {
  const s = E.copyState(G.states[pi.pubYear]), q = G.q[pi.pubQ];
  const now = G.states[pi.decisionYear];
  s.zU = q.usd; s.zC = E.logit(q.cny); s.q = pi.pubQ;
  s.eventYear = now.eventYear; s.eventQ = now.eventQ;
  return s;
}

function staffEstimate(seat, pi, draft) {
  const fixed = {}, start = publishedState(pi);
  fixed[pi.decisionYear] = { [seat]: G.recs[pi.decisionYear].g[seat] };
  pi.ys.forEach((y) => {
    fixed[y] = { [seat]: draft.g };
    if (seat === CN && draft.event === y) fixed[y].event = true;
  });
  return E.estimate(P, {
    seed: G.seed * 7919 + pi.k * 101 + SEATS.indexOf(seat) * 13 + 17,
    n: D.staff_draws, start, fixed, endYear: pi.endYear, usdQ: pi.usdQ,
    growthYear: pi.growthYear, usModel: seat !== US, cnModel: seat !== CN,
    noEventThrough: start.eventYear ? 0 : pi.decisionYear });
}

function resolvePeriod() {
  const pi = period(G.k), sheets = G.sheets[G.k];
  pi.ys.forEach((y) => {
    const c = {};
    G.order.forEach((s) => { c[s] = sheets[s].g; });
    if (G.human[CN] && sheets[CN].event === y) c.event = true;
    advance(c);
  });
  const out = { usd: G.q[pi.usdQ].usd, grow: alliedGrowth(pi.growthYear) }, sc = {};
  G.order.forEach((s) => {
    const sh = sheets[s];
    sc[s] = {
      usd: E.winkler(sh.usd[0], sh.usd[1], out.usd, D.coverage),
      grow: E.winkler(sh.grow[0], sh.grow[1], out.grow, D.coverage),
      staffUsd: E.winkler(sh.staff.usd[0], sh.staff.usd[2], out.usd, D.coverage),
      staffGrow: E.winkler(sh.staff.grow[0], sh.staff.grow[2], out.grow, D.coverage) };
  });
  G.scores[G.k] = { out, seats: sc };
}

/* ------------------------------------------------------------- chrome */
function mast(front) {
  $("mast").innerHTML = front
    ? `<header class="front"><div class="series">The Primacy Premium</div>
       <h1>Committee Exercise</h1>
       <p class="subtitle">A four-seat budget exercise on the estimated model, 2026 to 2035</p>
       <div class="byline">alyssa i. agard</div><hr class="rule2 draw"></header>`
    : `<header class="compact"><span class="t">Committee Exercise</span>
       <span class="series">The Primacy Premium</span></header>`;
}
function rail(state) {
  if (!G) { $("rail").innerHTML = ""; return; }
  $("rail").innerHTML = `<div class="rail-track">` + D.periods.map((p, i) => {
    const cls = state === "debrief" || i < G.k || (state === "resolution" && i === G.k)
      ? "done" : i === G.k ? "now" : "";
    return `<div class="rail-seg ${cls}"><span class="rail-roman">${p.roman}</span>
      <span class="rail-years">${p.years.join(" and ")}</span></div>`;
  }).join("") + `</div>`;
}
function handoff(title, text, label, then) {
  $("handoff-title").textContent = title;
  $("handoff-text").textContent = text;
  $("handoff-btn").textContent = label;
  $("handoff").classList.add("active");
  $("handoff-btn").onclick = () => { $("handoff").classList.remove("active"); then(); };
  $("handoff-btn").focus();
}
function show(html, state) {
  mast(state === "front");
  rail(state);
  $("app").innerHTML = html;
  window.scrollTo(0, 0);
}
const hasPlotly = () => typeof Plotly !== "undefined";
function plot(id, traces, layout) {
  const el = $(id);
  if (!el) return;
  if (!hasPlotly()) {
    el.innerHTML = `<p class="quiet">The chart library did not load. The tables carry the same figures.</p>`;
    el.style.minHeight = "0";
    return;
  }
  const base = {
    font: { family: '"Times New Roman", Times, serif', size: 14, color: T.ink },
    paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
    margin: { l: 56, r: 16, t: 14, b: 40 }, showlegend: true,
    legend: { orientation: "h", y: -0.16, x: 0 }, hovermode: "x unified",
    xaxis: { showgrid: false, linecolor: T.line, ticks: "outside", tickcolor: T.line, dtick: 2 },
    yaxis: { gridcolor: T.grid, zeroline: false, linecolor: T.line },
    hoverlabel: { bgcolor: "#060a14", bordercolor: T.line, font: { family: '"Times New Roman", Times, serif', color: T.ink } } };
  Object.keys(layout || {}).forEach((k) => {
    base[k] = typeof layout[k] === "object" && !Array.isArray(layout[k]) && base[k]
      ? Object.assign({}, base[k], layout[k]) : layout[k];
  });
  if (el.clientWidth < 520) {        // narrow screens: fewer ticks, lower legend
    delete base.xaxis.dtick;
    Object.assign(base.xaxis, { nticks: 5, tickangle: 0 });
    base.legend = Object.assign({}, base.legend, { y: -0.22 });
    base.margin = Object.assign({}, base.margin, { l: 48 });
  }
  Plotly.react(el, traces, base, { displayModeBar: false, responsive: true });
}

/* -------------------------------------------------------------- front */
const PRESETS = [
  ["United States alone", [US]], ["China alone", [CN]], ["Both principals", [US, CN]],
  ["Alliance table", [US, EU, IP]], ["All four seats", SEATS]];

function front() {
  G = null;
  const src = M.source, fb = M.feedback;
  show(`
  <p class="measure">Four committees set real military expenditure for the United States, China, NATO Europe, and the Indo-Pacific allies over five periods to ${D.horizon}. Commitments are sealed and simultaneous. Any seat without a committee is run by the estimated model of <a href="${src.repository}">The Primacy Premium</a>, release ${esc(src.version)}, which also runs the hedging middle powers, the rest of the world, and the reserve currency shares. The exercise is a conditional forecasting instrument: it reports what the estimated model implies given the commitments made. It does not state that any path will occur.</p>

  <div class="panel alt">
    <h2 style="margin-top:0">Order of play</h2>
    <ol class="steps">
      <li>Read the published record. Expenditure for a year publishes the following April and reserve shares publish one quarter late, so each committee decides on data one to two years old for every seat but its own.</li>
      <li>Commit one real growth rate for the period. The range is the 5th to 95th percentile of the seat's own annual growth, ${D.bound_rule.sample[0]} to ${D.bound_rule.sample[1]}.</li>
      <li>State an ${Math.round(100 * D.coverage)} percent interval for the US dollar reserve share and for combined allied real growth. Both are scored when the figures publish.</li>
      <li>Seal the commitment. With more than one committee, pass the device; no committee sees another's sheet.</li>
      <li>Read the resolution. After period ${D.periods[LAST].roman} the debrief opens the sealed record: the parameters drawn for this exercise, every seat's path, and each commitment set against the model's equation for that seat.</li>
    </ol>
  </div>

  <h2>Convene the exercise</h2>
  <div class="panel">
    <div class="scroll"><table>
      <thead><tr><th>Seat</th><th class="r">Outlays, ${M.base_year}</th><th class="r">Real growth, ${M.base_year}</th><th class="r">Ten-year rate</th><th>Held by</th></tr></thead>
      <tbody>${SEATS.map((s, i) => `<tr>
        <td>${sw(s)}${s}</td><td class="r">${bn(M.base[s])}</td>

      </tbody>
      <caption>Outlays in billions of constant 2024 US dollars; growth in percent. Source: SIPRI Military Expenditure Database, tier totals chain-linked over matched members. Ten-year rate is compound growth, ${M.rates.trend_window[0]} to ${M.rates.trend_window[1]}.</caption>

  <h2>Reference path</h2>
  <div id="c-ref" class="chart"></div>
  <p class="quiet measure">Observed outlays to ${M.base_year}, then the median of the accretion pathway with every seat run by the model (${REF.draws.toLocaleString("en-US")} draws). Objectives and debrief comparisons are stated against this reference. Billions of constant 2024 US dollars.</p>

  <h2>What is estimated and what is assumed</h2>
  <div class="grid2">
    <div>
      <h3>Estimated, from release ${esc(src.version)}</h3>
      <ul class="plain">
        <li>Allied response equations for three tiers, ${fb[EU].sample[0]} to ${fb[EU].sample[1]}, with coefficient covariance. NATO Europe: ${sg(fb[EU].mean[1], 3)} on lagged US growth (standard error ${f(fb[EU].se[1], 3)}), ${sg(fb[EU].mean[2], 3)} on lagged Chinese growth (${f(fb[EU].se[2], 3)}).</li>
        <li>Reserve share response to the China to United States expenditure ratio: ${sg(M.reserve.usd.mean[1], 2)} points per unit log change (standard error ${f(M.reserve.usd.se[1], 2)}), R squared ${f(M.reserve.usd.r2, 3)}.</li>
        <li>Residuals for six blocks, ${M.resid.years[0]} to ${M.resid.years[M.resid.years.length - 1]}, resampled by stationary bootstrap with a mean run of ${M.mean_run_years} years.</li>
        <li>The 2022 episode: reserve share changes in two quarters, the later drift shift, and the change in allied growth.</li>
      </ul>
    </div>
    <div>
      <h3>Assumed by the exercise</h3>
      <ul class="plain">

    </div>
  </div>

  <details>
    <summary>Method in brief</summary>
    <p class="measure">The engine is the model's own recursion, run in the browser. With every seat run by the model it reproduces the published ${D.horizon} medians of release ${esc(src.version)} for all three pathways: the largest deviation across ${REF.parity.rows.length} medians is ${f(maxDev("%"), 2)} percent for expenditure levels and ${f(maxDev("pp"), 2)} points for shares, at ${REF.draws.toLocaleString("en-US")} draws. The difference is sampling error from a different random number generator.</p>
    <p class="measure">In release ${esc(src.version)} the allied response hypothesis is ${esc(M.h2.verdict)} in the pooled test (one-sided p ${f(M.h2.p_one_sided, 2)}). Coefficient signs are therefore uncertain, and the sealed draws retain that uncertainty. The reserve response is weak. Committees should expect expenditure to respond to commitments far more than reserve shares do.</p>
    <p class="measure">Interval statements are scored by the Winkler rule at ${Math.round(100 * D.coverage)} percent coverage: the width of the interval plus ${f(2 / (1 - D.coverage), 0)} times the distance by which the outcome falls outside it. Lower is better. Each committee's score is reported beside the score of the staff interval it was shown.</p>
    <p class="measure">Full method: <a href="https://github.com/alyssaagard/primacy-committee-exercise/blob/main/METHOD.md">METHOD.md</a>. Model report: <a href="https://primacy.alyssaagard.dev/report.html">The Primacy Premium, report</a>.</p>
  </details>`, "front");

  const hy = M.history.years, ry = Object.keys(REF.year_medians).map(Number);
  plot("c-ref", SEATS.flatMap((b) => [
    { x: hy, y: M.history.levels[b].map((v) => v / 1000), mode: "lines", name: b, line: { color: COLOR[b], width: 2 } },
    { x: [M.base_year].concat(ry), y: [M.base[b]].concat(ry.map((y) => REF.year_medians[y][b])).map((v) => v / 1000),
      mode: "lines", showlegend: false, line: { color: COLOR[b], width: 1.4, dash: "dot" } }]),

}
function maxDev(unit) {
  return REF.parity.rows.filter((r) => r.deviation.endsWith(unit))
    .reduce((a, r) => Math.max(a, Math.abs(parseFloat(r.deviation))), 0);
}

/* --------------------------------------------------------- seat paper */
function recordTable(year, own) {
  const lvl = G.states[year].lvl, w = world(lvl);
  return `<div class="scroll"><table>
    <thead><tr><th>Block</th><th class="r">Outlays, ${year}</th><th class="r">Real growth, ${year}</th><th class="r">Share of world</th></tr></thead>
    <tbody>${M.blocks.map((b) => `<tr${b === own ? ' class="own"' : ""}>
      <td>${sw(b)}${b}<span class="tag">${b === own ? "this seat" : holder(b)}</span></td>
      <td class="r">${bn(lvl[b])}</td><td class="r">${sg(growthOf(year, b))}</td>
      <td class="r">${f(100 * lvl[b] / w)}</td></tr>`).join("")}
      <tr class="total"><td>World</td><td class="r">${bn(w)}</td><td class="r"></td><td class="r">100.0</td></tr>
    </tbody>
    <caption>Billions of constant 2024 US dollars; growth and shares in percent. Rest of world includes Russia.</caption>
  </table></div>`;
}
function circularHtml(s) {
  if (!s.eventYear) return "";
  return `<div class="circular"><div class="chead"><span>Circular, ${E.qLabel(s.eventQ)}</span><span>Demonstration recorded</span></div>
    <p>A demonstration is recorded in ${s.eventYear}. Reserve shares move by the changes observed in 2022-Q1 and 2022-Q2 and drift shifts afterwards. Allied tiers run by the model add their measured post-2022 change in growth, declining to zero over ${M.decay_years} years. The war risk premium multiple recorded for the 2022 episode is ${f(M.war_risk_multiple, 1)}.</p></div>`;
}

function openSeat() {
  const seat = G.order[G.turn], pi = period(G.k), sd = D.seats[seat];
  const pub = G.states[pi.pubYear], now = G.states[pi.decisionYear];
  const fb = M.feedback[seat];
  const refs = sd.refs.slice();
  if (fb) {
    refs.unshift(["Model equation", Math.min(sd.bounds[1], Math.max(sd.bounds[0],
      fb.mean[0] + fb.mean[1] * growthOf(pi.pubYear, US) + fb.mean[2] * growthOf(pi.pubYear, CN)))]);
  }
  const prior = G.k > 0 ? G.sheets[G.k - 1][seat].g : snap(sd.trend);
  const draft = { g: Math.min(sd.bounds[1], Math.max(sd.bounds[0], prior)), event: 0,
                  autoUsd: true, autoGrow: true, usd: [0, 0], grow: [0, 0], est: null };
  const window_ = seat === CN && !now.eventYear
    ? pi.ys.filter((y) => y >= M.event_years[0] && y <= M.event_years[1]) : [];
  const q = G.q[pi.pubQ], many = G.order.length > 1;
  const tq = E.qLabel(pi.usdQ);

  show(`
  <div class="banner"><span class="who" style="color:${COLOR[seat]}">${seat} committee</span>

    ${circularHtml(now) || `<p class="quiet">No demonstration is recorded.</p>`}
  </div></section>

  <section class="para"><span class="n">2.</span><div>
    <h2>Own program</h2>
    <p class="measure">Outlays in ${pi.decisionYear}: ${bn(now.lvl[seat])} billion, real growth ${sg(growthOf(pi.decisionYear, seat))} percent${G.k === 0 ? ", as resolved by the model for the year in progress" : ", as committed in period " + D.periods[G.k - 1].roman}. This figure is known to this committee and is not yet published.</p>
  </div></section>

  <div class="grid2 seatgrid">
  <section class="para"><span class="n">3.</span><div>
    <h2>Commitment</h2>
    <div class="panel sheet" style="margin-top:.4rem">
      <label for="g" class="quiet">Real growth per year, ${pi.ys.join(" and ")}</label>
      <div class="rate"><span class="v" id="gv"></span><span class="u">percent</span></div>
      <input type="range" id="g" min="${sd.bounds[0]}" max="${sd.bounds[1]}" step="${D.step}" value="${draft.g}">
      <div class="scale"><span>${sg(sd.bounds[0])}</span><span>observed range, ${D.bound_rule.sample[0]} to ${D.bound_rule.sample[1]}</span><span>${sg(sd.bounds[1])}</span></div>
      <div class="btnrow" style="margin:.8rem 0 .4rem">
        ${refs.map((r) => `<button class="btn small" data-ref="${snap(r[1])}">${r[0]}, ${sg(r[1])}</button>`).join("")}
      </div>
      <div id="outlays"></div>
      ${window_.length ? `<p style="margin-top:.9rem"><label for="event">Demonstration</label>
        <select id="event" style="margin-left:.5rem"><option value="0">None this period</option>
        ${window_.map((y) => `<option value="${y}">In ${y}</option>`).join("")}</select></p>
        <p class="quiet">One demonstration is available to this seat between ${M.event_years[0]} and ${M.event_years[1]}. It repeats the measured 2022 episode and carries no score of its own.</p>` : ""}
    </div>
  </div></section>

  <section class="para"><span class="n">4.</span><div>
    <h2>Staff estimate and stated intervals</h2>
    <div id="fan" class="chart"></div>
    <div class="scroll"><table>
      <thead><tr><th>Quantity</th><th class="r nw">Staff range</th><th class="r">Lower</th><th class="r">Upper</th></tr></thead>
      <tbody>
        <tr><td><label for="u0">US dollar reserve share, ${tq}, percent</label></td><td class="r nw" id="su"></td>
          <td class="r"><input class="iv" type="number" step="0.1" id="u0" aria-label="US dollar share, lower bound"></td>
          <td class="r"><input class="iv" type="number" step="0.1" id="u1" aria-label="US dollar share, upper bound"></td></tr>
        <tr><td><label for="a0">Combined real growth, NATO Europe and Indo-Pacific allies, ${pi.growthYear}, percent</label></td><td class="r nw" id="sa"></td>
          <td class="r"><input class="iv" type="number" step="0.1" id="a0" aria-label="Allied growth, lower bound"></td>
          <td class="r"><input class="iv" type="number" step="0.1" id="a1" aria-label="Allied growth, upper bound"></td></tr>
        <tr><td>China to United States ratio, ${pi.endYear}</td><td class="r nw" id="sr"></td><td></td><td></td></tr>
      </tbody>
      <caption>Staff range is the 10th to 90th percentile of ${D.staff_draws} draws of the model from the published record, given this commitment. Every other seat is taken at its model equation, with the three pathways at equal probability. The staff cannot see the sealed record or another committee's sheet.</caption>
    </table></div>
  </div></section>
  </div>

  <p class="err" id="seat-err" role="alert"></p>
  <div class="btnrow"><button class="btn primary" id="commit">Seal the commitment</button>
    <span class="quiet">${many ? `Seat ${G.turn + 1} of ${G.order.length} this period.` : ""}</span></div>`, "seat");

  const hist = M.reserve.history, hx = [], hy = [];
  hist.quarters.forEach((s, i) => {
    const x = +s.slice(0, 4) + (+s.slice(6) - 1) / 4;
    if (x >= 2019) { hx.push(x); hy.push(hist.usd[i]); }
  });
  for (let qi = 0; qi <= pi.pubQ; qi++) { hx.push(qx(qi)); hy.push(G.q[qi].usd); }

  function refresh() {
    draft.est = staffEstimate(seat, pi, draft);
    const e = draft.est;
    $("gv").textContent = sg(draft.g);
    let lv = now.lvl[seat];
    $("outlays").innerHTML = `<table><thead><tr><th>Year</th><th class="r">Outlays</th><th class="r">Change from ${pi.decisionYear}</th></tr></thead><tbody>` +
      pi.ys.map((y) => { lv *= 1 + draft.g / 100;
        return `<tr><td>${y}</td><td class="r">${bn(lv)}</td><td class="r">${sbn(lv - now.lvl[seat], 1)}</td></tr>`; }).join("") +
      `</tbody><caption>Billions of constant 2024 US dollars.</caption></table>`;
    $("su").textContent = `${f(e.usd[0], 1)} to ${f(e.usd[2], 1)}`;
    $("sa").textContent = `${sg(e.growth[0], 1)} to ${sg(e.growth[2], 1)}`;
    $("sr").textContent = `${f(e.ratio[0], 3)} to ${f(e.ratio[2], 3)}`;
    if (draft.autoUsd) { $("u0").value = e.usd[0].toFixed(1); $("u1").value = e.usd[2].toFixed(1); }
    if (draft.autoGrow) { $("a0").value = e.growth[0].toFixed(1); $("a1").value = e.growth[2].toFixed(1); }
    chart();
  }
  function chart() {
    const e = draft.est, fx = [hx[hx.length - 1]], lo = [hy[hy.length - 1]], md = lo.slice(), hi = lo.slice();
    e.fan.forEach((k) => { fx.push(qx(k.qi)); lo.push(k.p10); md.push(k.p50); hi.push(k.p90); });
    const u0 = +$("u0").value, u1 = +$("u1").value, tx = qx(pi.usdQ);
    plot("fan", [
      { x: hx, y: hy, mode: "lines", name: "Published", line: { color: T.ink, width: 1.6 } },
      { x: fx, y: hi, mode: "lines", line: { width: 0 }, showlegend: false, hoverinfo: "skip" },
      { x: fx, y: lo, mode: "lines", line: { width: 0 }, fill: "tonexty", fillcolor: T.band, name: "Staff, 10th to 90th" },
      { x: fx, y: md, mode: "lines", name: "Staff median", line: { color: T.pink, width: 1.6, dash: "dot" } },
      { x: [tx, tx], y: [u0, u1], mode: "lines+markers", name: "Stated interval",
        line: { color: COLOR[seat], width: 3 }, marker: { symbol: "line-ew", size: 12, line: { width: 3, color: COLOR[seat] } } }
    ], { yaxis: { title: { text: "US dollar share, percent" } }, xaxis: { dtick: 1 } });
  }
  $("g").oninput = () => { draft.g = +$("g").value; refresh(); };
  document.querySelectorAll("[data-ref]").forEach((b) => {
    b.onclick = () => { draft.g = +b.dataset.ref; $("g").value = draft.g; refresh(); };
  });
  if ($("event")) $("event").onchange = () => { draft.event = +$("event").value; refresh(); };
  ["u0", "u1"].forEach((id) => { $(id).oninput = () => { draft.autoUsd = false; chart(); }; });
  ["a0", "a1"].forEach((id) => { $(id).oninput = () => { draft.autoGrow = false; }; });
  refresh();

  $("commit").onclick = () => {
    const v = ["u0", "u1", "a0", "a1"].map((id) => parseFloat($(id).value));
    if (v.some((x) => !isFinite(x))) { $("seat-err").textContent = "Enter a number in each interval bound."; return; }
    if (v[0] > v[1] || v[2] > v[3]) { $("seat-err").textContent = "Each lower bound must not exceed its upper bound."; return; }
    G.sheets[G.k] = G.sheets[G.k] || {};
    G.sheets[G.k][seat] = { g: draft.g, event: draft.event, usd: [v[0], v[1]], grow: [v[2], v[3]],
                            staff: { usd: draft.est.usd, grow: draft.est.growth } };
    G.turn += 1;
    const after = () => {
      if (G.turn < G.order.length) { openSeat(); return; }
      resolvePeriod();
      if (G.k === LAST) debrief(); else resolution();
    };
    if (!many) { after(); return; }
    $("app").innerHTML = "";
    if (G.turn < G.order.length) {
      handoff("Commitment sealed", `Pass the device to the ${G.order[G.turn]} committee.`,
              `Open the ${G.order[G.turn]} paper`, after);
    } else {
      handoff("All commitments sealed", `Period ${pi.roman} resolves. The resolution is public to every committee.`,
              "Read the resolution", after);
    }
  };
}

/* ----------------------------------------------------------- scoring */
function scoreRows(k) {
  const pi = period(k), sc = G.scores[k], sheets = G.sheets[k];
  const row = (seat, label, iv, st, out, w, sw_, dp, signed) => {
    const fm = signed ? sg : f;
    return `<tr><td>${sw(seat)}${seat}</td><td>${label}</td>
      <td class="r">${fm(iv[0], dp)} to ${fm(iv[1], dp)}</td><td class="r">${fm(out, dp)}</td>
      <td class="r ${w.hit ? "ok" : "miss"}">${w.hit ? "inside" : "outside by " + f(w.miss, dp)}</td>
      <td class="r">${f(w.score, 1)}</td><td class="r">${f(sw_.score, 1)}</td></tr>`;
  };
  return G.order.map((s) =>
    row(s, `US dollar share, ${E.qLabel(pi.usdQ)}`, sheets[s].usd, sheets[s].staff.usd, sc.out.usd, sc.seats[s].usd, sc.seats[s].staffUsd, 2, false) +
    row(s, `Allied real growth, ${pi.growthYear}`, sheets[s].grow, sheets[s].staff.grow, sc.out.grow, sc.seats[s].grow, sc.seats[s].staffGrow, 1, true)).join("");
}
const SCORE_HEAD = `<thead><tr><th>Committee</th><th>Quantity</th><th class="r">Stated interval</th><th class="r">Outcome</th><th class="r">Result</th><th class="r">Score</th><th class="r">Staff score</th></tr></thead>`;

function pathwayNote(throughYear) {
  const recs = [];
  for (let y = D.start_year; y <= throughYear; y++) recs.push(G.recs[y]);
  const ev = G.states[Math.min(G.year, throughYear + 1)].eventYear;
  const mean = recs.reduce((a, r) => a + r.g[US], 0) / recs.length;
  const cls = E.classify(P, recs, ev);
  return `Mean US real growth, ${D.start_year} to ${throughYear}: ${sg(mean, 2)} percent per year. ${ev ? "A demonstration is recorded in " + ev + "." : "No demonstration is recorded."} The record to date is classed as ${cls}. The dividing line between accretion and retrenchment is ${sg(D.us_midpoint, 2)} percent, the midpoint of the two pathway rates.`;
}

/* --------------------------------------------------------- resolution */
function resolution() {
  const pi = period(G.k), nxt = period(G.k + 1);
  const pubQ = G.q[nxt.pubQ], sNow = G.states[nxt.decisionYear];
  const newEvent = sNow.eventYear && sNow.eventYear > pi.decisionYear;
  show(`
  <div class="banner"><span class="who">Resolution, period ${pi.roman}</span>
    <span class="when">Record as of November ${nxt.decisionYear}</span></div>
  ${newEvent ? circularHtml(sNow) : `<p class="quiet">No circular issued this period.</p>`}

  <h2>Newly published</h2>
  ${recordTable(nxt.pubYear, null)}
  <p class="measure">Commitments for ${nxt.pubYear} are now public. Expenditure for ${nxt.decisionYear} publishes in April ${nxt.decisionYear + 1}. Reserves at ${E.qLabel(nxt.pubQ)}: US dollar ${f(pubQ.usd, 2)} percent and renminbi ${f(pubQ.cny, 2)} percent of allocated reserves.</p>

  <h2>Interval statements</h2>
  <div class="scroll"><table>${SCORE_HEAD}<tbody>${scoreRows(G.k)}</tbody>
    <caption>Winkler score at ${Math.round(100 * D.coverage)} percent coverage: interval width plus ${f(2 / (1 - D.coverage), 0)} times any distance outside. Lower is better. The staff score is for the interval the committee was shown.</caption></table></div>

  <h2>Pathway record</h2>
  <p class="measure">${pathwayNote(nxt.pubYear)}</p>
  <div class="btnrow"><button class="btn primary" id="next">Open period ${nxt.roman}</button></div>`, "resolution");
  $("next").onclick = () => {
    G.k += 1; G.turn = 0;
    if (G.order.length > 1) {
      $("app").innerHTML = "";
      handoff(`Period ${nxt.roman}`, `Pass the device to the ${G.order[0]} committee.`, `Open the ${G.order[0]} paper`, openSeat);
    } else openSeat();
  };
}

/* ------------------------------------------------------------ debrief */
function pctl(key, v) {
  const p = E.percentileOf(REF.dist[key], REF.probs, v);
  return p <= 5 ? "below 5th" : p >= 95 ? "above 95th" : f(p, 0);
}
const refMed = (key) => REF.dist[key][REF.probs.indexOf(0.5)];

function debrief() {
  const years = [], recs = [];
  for (let y = D.start_year; y <= D.horizon; y++) { years.push(y); recs.push(G.recs[y]); }
  const end = G.states[D.horizon], cum = {};
  SEATS.forEach((s) => { cum[s] = years.reduce((a, y) => a + G.states[y].lvl[s], 0); });
  const meas = E.measures(P, end, cum), W = G.W;
  const cls = E.classify(P, recs, end.eventYear);
  const MEAS = [["cn_us", "China to United States expenditure ratio", 3, ""],
    ["coalition_cn", "Coalition to China expenditure ratio", 2, ""],
    ["us_share_coalition", "United States share of coalition expenditure", 1, "percent"],
    ["allied_share", "NATO Europe and Indo-Pacific allies, share of world", 1, "percent"],
    ["usd", "US dollar reserve share, " + D.horizon + "-Q4", 2, "percent"],
    ["cny", "Renminbi reserve share, " + D.horizon + "-Q4", 2, "percent"]];

  const sealed = [];
  sealed.push(G.human[US] ? "The United States was held by a committee, so no pathway rate was applied to it."
    : `The United States was run at the ${W.usPath === "retrenchment" ? "retrenchment rate, " + sg(M.rates.us_contraction, 2) : "ten-year rate, " + sg(M.rates.us_trend, 2)} percent per year, plus residuals.`);
  sealed.push(G.human[CN] ? (end.eventYear ? `The China committee declared a demonstration in ${end.eventYear}; it fell in ${E.qLabel(end.eventQ)}.` : "The China committee declared no demonstration.")
    : (end.eventYear ? `The sealed pathway placed a demonstration in ${end.eventYear}; it fell in ${E.qLabel(end.eventQ)}.` : "The sealed pathway contained no demonstration."));

  const objectives = G.order.map((s) => {
    const rows = D.seats[s].objectives.map((o) => {
      const v = meas[o.measure], r = refMed(o.measure), met = o.op === ">=" ? v >= r : v <= r;
      const dp = MEAS.find((m) => m[0] === o.measure)[2];
      return `<tr><td>${o.label}</td><td class="r">${f(v, dp)}</td><td class="r">${f(r, dp)}</td><td class="r ${met ? "ok" : "miss"}">${met ? "met" : "not met"}</td></tr>`;
    }).join("");
    const c = cum[s], cr = refMed("cum:" + s);
    let n = 0, hit = 0, sc = 0, st = 0;
    G.scores.forEach((k) => ["usd", "grow"].forEach((q) => {
      n += 1; hit += k.seats[s][q].hit ? 1 : 0; sc += k.seats[s][q].score;
      st += k.seats[s][q === "usd" ? "staffUsd" : "staffGrow"].score; }));
    return `<h3 style="color:${COLOR[s]}">${s} committee</h3>
      <div class="scroll"><table><thead><tr><th>Objective</th><th class="r">Outcome</th><th class="r">Reference median</th><th class="r">Result</th></tr></thead><tbody>${rows}
      <tr><td>Cumulative outlays, ${D.start_year} to ${D.horizon}, billions</td><td class="r">${bn(c)}</td><td class="r">${bn(cr)}</td><td class="r">${sbn(c - cr, 1)} (${sg(100 * (c / cr - 1), 1)} percent)</td></tr>
      <tr><td>Interval statements inside, of ${n}</td><td class="r">${hit}</td><td class="r">${f(n * D.coverage, 1)} expected</td><td class="r">mean score ${f(sc / n, 1)}; staff ${f(st / n, 1)}</td></tr>
      </tbody></table></div>`;
  }).join("");

  const elicit = G.order.map((s) => {
    const rows = years.filter((y) => y > D.start_year).map((y) => {
      const r = G.recs[y], dev = r.g[s] - r.model[s].fitted;
      return `<tr><td>${y}</td><td class="r">${sg(r.lagUS)}</td><td class="r">${sg(r.lagCN)}</td>
        <td class="r">${sg(r.g[s])}</td><td class="r">${sg(r.model[s].fitted)}</td><td class="r">${sg(dev)}</td>
        <td class="r">${f(E.residualPercentile(P, s, dev), 0)}</td><td class="r">${sg(r.model[s].sealed)}</td></tr>`;
    }).join("");
    return `<h3 style="color:${COLOR[s]}">${s} committee</h3>
      <div class="scroll"><table><thead><tr><th>Year</th><th class="r">US growth, prior year</th><th class="r">China growth, prior year</th><th class="r">Committed</th><th class="r">Model equation</th><th class="r">Deviation</th><th class="r">Percentile</th><th class="r">Sealed model value</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join("");

  const crow = (eq, on, est, se, draw, r2, tag) => `<tr><td>${eq}<span class="tag">${tag}</span></td><td>${on}</td>
    <td class="r">${sg(est, 3)} (${f(se, 3)})</td><td class="r">${sg(draw, 3)}</td><td class="r">${f(r2, 3)}</td></tr>`;
  const coefRows = M.allied.map((t) => {
    const fb = M.feedback[t], c = W.coef[t];
    return crow(sw(t) + t, "US real growth, prior year", fb.mean[1], fb.se[1], c[1], fb.r2, holder(t)) +
           crow(sw(t) + t, "China real growth, prior year", fb.mean[2], fb.se[2], c[2], fb.r2, holder(t));
  }).join("") +
    crow("US dollar reserve share, points", "Log change, China to US ratio", M.reserve.usd.mean[1], M.reserve.usd.se[1], W.usd[1], M.reserve.usd.r2, "model") +
    crow("Renminbi reserve share, log-odds", "Log change, China to US ratio", M.reserve.cny.mean[1], M.reserve.cny.se[1], W.cny[1], M.reserve.cny.r2, "model");

  show(`
  <div class="banner"><span class="who">Debrief</span><span class="when">The sealed record, ${D.start_year} to ${D.horizon}. Seed ${G.seed}</span></div>
  <p class="measure">The record is classed as ${cls}. ${sealed.join(" ")}</p>
  ${circularHtml(end)}

  <h2>Expenditure</h2>
  <div id="c-exp" class="chart tall"></div>
  <p class="quiet measure">Solid lines are this exercise. Dotted lines are the reference: the median of the accretion pathway with every seat run by the model, ${REF.draws.toLocaleString("en-US")} draws.</p>

  <h2>Reserve shares</h2>
  <div id="c-res" class="chart"></div>

  <h2>Position at ${D.horizon}</h2>
  <div class="scroll"><table>
    <thead><tr><th>Measure</th><th class="r">Outcome</th><th class="r">Reference median</th><th class="r">Percentile in reference</th></tr></thead>
    <tbody>${MEAS.map((m) => `<tr><td>${m[1]}${m[3] ? ", " + m[3] : ""}</td><td class="r">${f(meas[m[0]], m[2])}</td><td class="r">${f(refMed(m[0]), m[2])}</td><td class="r">${pctl(m[0], meas[m[0]])}</td></tr>`).join("")}</tbody>
    <caption>The coalition is the United States, NATO Europe, and the Indo-Pacific allies. Percentile is the position of the outcome in the reference distribution.</caption>
  </table></div>

  <h2>Committees</h2>
  <p class="measure">The exercise names no winner. Each committee is reported on three separate axes: its stated objectives, what it spent, and the calibration of its interval statements. The objectives are design assumptions.</p>
  ${objectives}

  <details>
    <summary>Interval statements, all periods</summary>
    <div class="scroll"><table>${SCORE_HEAD}<tbody>${G.scores.map((_, k) => scoreRows(k)).join("")}</tbody></table></div>
  </details>

  <h2>Commitments against the model</h2>
  <p class="measure">Each commitment is set against the value of the model equation for that seat at the growth rates realized in the prior year, using the published point estimates. For the two principals the equation is the ten-year rate. Percentile is the share of the seat's historical residuals, ${M.resid.years[0]} to ${M.resid.years[M.resid.years.length - 1]}, that lie below the deviation. The last column is the value the model would have drawn for the seat in this sealed record.</p>
  ${elicit}

  <h2>Sealed coefficients</h2>
  <div class="scroll"><table>
    <thead><tr><th>Equation</th><th>Coefficient on</th><th class="r">Estimate</th><th class="r">Sealed draw</th><th class="r">R squared</th></tr></thead>
    <tbody>${coefRows}</tbody>
    <caption>Standard errors in parentheses. Estimates from The Primacy Premium, release ${esc(M.source.version)}. Each sealed draw is one draw from the joint normal distribution of the estimate. A seat held by a committee does not use its equation.</caption>
  </table></div>

  <div class="btnrow"><button class="btn primary" id="save">Download the record</button>
    <button class="btn" id="again">Convene again</button></div>`, "debrief");

  const hy = M.history.years.filter((y) => y >= 2015), off = M.history.years.indexOf(2015);
  const traces = [];
  M.blocks.forEach((b) => {
    const seat = SEATS.includes(b);
    traces.push({ x: hy.concat(years), y: M.history.levels[b].slice(off).concat(years.map((y) => G.states[y].lvl[b])).map((v) => v / 1000),
                  mode: "lines", name: b, line: { color: COLOR[b], width: seat ? 2.2 : 1.2 } });
    if (seat) traces.push({ x: [M.base_year].concat(years), y: [M.base[b]].concat(years.map((y) => REF.year_medians[y][b])).map((v) => v / 1000),
                  mode: "lines", showlegend: false, hoverinfo: "skip", line: { color: COLOR[b], width: 1.2, dash: "dot" } });
  });
  plot("c-exp", traces, { yaxis: { title: { text: "Billions, constant 2024 US dollars" } },
    shapes: [{ type: "line", x0: M.base_year, x1: M.base_year, yref: "paper", y0: 0, y1: 1, line: { color: T.muted, width: 1, dash: "dot" } }] });

  const hist = M.reserve.history, rx = [], ru = [], rc = [];
  hist.quarters.forEach((s, i) => { const x = +s.slice(0, 4) + (+s.slice(6) - 1) / 4;
    if (x >= 2017) { rx.push(x); ru.push(hist.usd[i]); rc.push(hist.cny[i]); } });
  for (let qi = 0; qi < P.nq; qi++) { rx.push(qx(qi)); ru.push(G.q[qi].usd); rc.push(G.q[qi].cny); }
  const fx = REF.usd_fan.map((k) => qx(k.qi));
  plot("c-res", [
    { x: fx, y: REF.usd_fan.map((k) => k.p90), mode: "lines", line: { width: 0 }, showlegend: false, hoverinfo: "skip" },
    { x: fx, y: REF.usd_fan.map((k) => k.p10), mode: "lines", line: { width: 0 }, fill: "tonexty", fillcolor: T.band, name: "Reference, 10th to 90th" },
    { x: rx, y: ru, mode: "lines", name: "US dollar", line: { color: COLOR[US], width: 2 } },
    { x: rx, y: rc, mode: "lines", name: "Renminbi (right axis)", yaxis: "y2", line: { color: COLOR[CN], width: 2 } }
  ], { yaxis: { title: { text: "US dollar share, percent" } },
       yaxis2: { title: { text: "Renminbi share, percent" }, overlaying: "y", side: "right", showgrid: false, zeroline: false, linecolor: T.line, rangemode: "tozero" },
       margin: { l: 56, r: 56, t: 14, b: 40 } });

  $("again").onclick = front;
  $("save").onclick = () => {
    const rec = {
      exercise: "The Primacy Premium, Committee Exercise", model: M.source, seed: G.seed,
      seats: Object.fromEntries(SEATS.map((s) => [s, G.human[s] ? "committee" : "model"])),
      classification: cls, sealed: { pathway: W.path, us_rate: W.usPath, event_year: end.eventYear,
        event_quarter: end.eventYear ? E.qLabel(end.eventQ) : null, coefficients: W.coef, usd: W.usd, cny_logit: W.cny },
      commitments: G.sheets, scores: G.scores,
      years: years.map((y) => ({ year: y, growth_pct: G.recs[y].g, level_musd: G.states[y].lvl, model: G.recs[y].model })),
      quarters: Object.keys(G.q).map(Number).sort((a, b) => a - b).filter((qi) => qi >= 0)
        .map((qi) => ({ quarter: E.qLabel(qi), usd_pct: G.q[qi].usd, cny_pct: G.q[qi].cny })),
      position: meas, reference_medians: Object.fromEntries(Object.keys(REF.dist).map((k) => [k, refMed(k)])) };
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(rec, null, 1)], { type: "application/json" }));
    a.download = `committee-exercise-${G.seed}.json`;
    document.body.appendChild(a); a.click(); a.remove();
  };
}

/* --------------------------------------------------------------- boot */
SEATS.forEach((s) => {
  const y = M.history.years, lv = M.history.levels[s];
  const i0 = y.indexOf(M.rates.trend_window[0]), i1 = y.indexOf(M.rates.trend_window[1]);
  D.seats[s].trend = 100 * (Math.pow(lv[i1] / lv[i0], 1 / (i1 - i0)) - 1);
});
$("foot").innerHTML = `Alyssa I. Agard. Licensed CC BY-NC 4.0. Model: <a href="${M.source.repository}">The Primacy Premium</a>, release ${esc(M.source.version)}, commit ${M.source.commit.slice(0, 7)}. Built ${esc(PAYLOAD.meta.built)}. Source: <a href="https://github.com/alyssaagard/primacy-committee-exercise">repository</a>, <a href="https://github.com/alyssaagard/primacy-committee-exercise/blob/main/METHOD.md">method</a>.`;
window.CX = { get game() { return G; }, front, newGame };
front();
</script>
</body>
</html>
