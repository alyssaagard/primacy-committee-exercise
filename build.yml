# Rebuilds the exercise from source on every push and fails if the committed
# index.html does not match a fresh rebuild. The build is deterministic under
# seed 20260724, so a match is the expected result; a failure means the
# committed page is stale. Rerun both build scripts locally and commit.

name: verify build

on:
  push:
    paths:
      - "build_data.py"
      - "build_page.py"
      - "template.html"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy scipy
      - name: Preserve the committed build
        run: cp index.html /tmp/committed.html
      - name: Rebuild from source
        run: |
          python3 build_data.py
          python3 build_page.py
      - name: Compare against the committed build
        run: |
          if diff -q /tmp/committed.html index.html > /dev/null; then
            echo "Reproducible: committed build matches a fresh rebuild."
          else
            echo "::error::index.html is stale. Rerun both build scripts and commit."
            exit 1
          fi
